---
name: Test Nextcloud App
'on':
  push:
    paths:
      - 'appinfo/**'
      - 'lib/**'
      - 'templates/**'
      - '.github/workflows/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
  workflow_dispatch:
jobs:
  software_version:
    name: Get appinfo/info.xml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_id: ${{ steps.software_version.outputs.app_id }}
      app_version: ${{ steps.software_version.outputs.app_version }}
      php_min: ${{ steps.software_version.outputs.php_min }}
      php_max: ${{ steps.software_version.outputs.php_max }}
      nc_min: ${{ steps.software_version.outputs.nc_min }}
      nc_max: ${{ steps.software_version.outputs.nc_max }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: Install xmllint
        run: sudo apt update && sudo apt install -y libxml2-utils

      - name: Extract
        id: software_version
        run: |
          x() { xmllint --xpath "string($1)" appinfo/info.xml; }
          {
            echo "app_id=$(x '//info/id')"
            echo "app_version=$(x '//info/version')"
            echo "php_min=$(x '//info/dependencies/php/@min-version')"
            echo "php_max=$(x '//info/dependencies/php/@max-version')"
            echo "nc_min=$(x '//info/dependencies/nc/@min-version')"
            echo "nc_max=$(x '//info/dependencies/nc/@max-version')"
          } >> "$GITHUB_OUTPUT"

  php:
    name: PHP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: software_version
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.software_version.outputs.php_min }}
          coverage: none

      - name: PHP syntax check
        run: |
          find appinfo lib templates -name "*.php" -print0 | xargs -0 -n1 php -l

  xml:
    name: XML
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: Install xmllint
        run: sudo apt update && sudo apt install -y libxml2-utils

      - name: XML syntax check
        run: |
          find appinfo lib templates -name "*.xml" -print0 | \
            xargs -0 -n1 xmllint --noout

      - name: Download Nextcloud app schema
        run: |
          curl --fail --silent --show-error \
            --location https://apps.nextcloud.com/schema/apps/info.xsd \
            --output info.xsd

      - name: Validate appinfo/info.xml
        run: xmllint --noout --schema info.xsd appinfo/info.xml

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      - name: YAML syntax check
        run: yamllint .

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  json:
    name: JSON
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: JSON syntax check(jq)
        run: find . -name '*.json' -print0 | xargs -0 -n1 jq empty
